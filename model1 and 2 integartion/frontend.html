<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Medical Conversation</title>
  <style>
    body { max-width: 720px; margin: 40px auto; padding: 0 16px; font: 16px system-ui, sans-serif; }
    #messages { min-height: 300px; border: 1px solid #ccc; padding: 16px; margin-bottom: 16px; }
    .message { margin: 12px 0; white-space: pre-wrap; }
    .assistant { color: #174ea6; }
    .user { color: #137333; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 12px; }
    button { padding: 12px 18px; cursor: pointer; }
    #status { color: #666; margin: 12px 0; }
  </style>
</head>
<body>
  <h1>Medical Conversation</h1>
  <div id="status">Starting conversation...</div>
  <main id="messages" aria-live="polite"></main>
  <form id="message-form">
    <input id="message-input" autocomplete="off" placeholder="Type your answer" disabled>
    <button id="send-button" type="submit" disabled>Send</button>
  </form>

  <script>
    const API_BASE_URL = window.location.protocol === "file:"
      ? "http://localhost:8000"
      : window.location.origin;
    let sessionId = null;

    const statusElement = document.getElementById("status");
    const messagesElement = document.getElementById("messages");
    const inputElement = document.getElementById("message-input");
    const sendButton = document.getElementById("send-button");
    const formElement = document.getElementById("message-form");

    function addMessage(role, text) {
      const messageElement = document.createElement("div");
      messageElement.className = `message ${role}`;
      messageElement.textContent = `${role === "assistant" ? "Assistant" : "You"}: ${text}`;
      messagesElement.appendChild(messageElement);
      messagesElement.scrollTop = messagesElement.scrollHeight;
    }

    async function startConversation() {
      const response = await fetch(`${API_BASE_URL}/conversation/start`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ patient_id: "frontend-user" })
      });

      if (!response.ok) {
        throw new Error(`Start failed: ${response.status}`);
      }

      const data = await response.json();
      sessionId = data.session_id;
      addMessage("assistant", data.assistant_message);
      statusElement.textContent = "Conversation active";
      inputElement.disabled = false;
      sendButton.disabled = false;
      inputElement.focus();
    }

    formElement.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = inputElement.value.trim();
      if (!message || !sessionId) return;

      addMessage("user", message);
      inputElement.value = "";
      inputElement.disabled = true;
      sendButton.disabled = true;
      statusElement.textContent = "Assistant is thinking...";

      try {
        const response = await fetch(
          `${API_BASE_URL}/conversation/${sessionId}/message`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message })
          }
        );

        if (!response.ok) {
          throw new Error(`Message failed: ${response.status}`);
        }

        const data = await response.json();
        addMessage("assistant", data.assistant_message);
        statusElement.textContent = "Conversation active";
      } catch (error) {
        statusElement.textContent = `Error: ${error.message}`;
      } finally {
        inputElement.disabled = false;
        sendButton.disabled = false;
        inputElement.focus();
      }
    });

    startConversation().catch((error) => {
      statusElement.textContent = `Could not connect to API: ${error.message}`;
    });
  </script>
</body>
</html>
